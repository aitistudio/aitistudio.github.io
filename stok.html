<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Stok - Aiti Design</title>
    <link rel="icon" type="image/png" href="https://aitistudio.github.io/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    
    <!-- Tailwind Dark Mode Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    <!-- Google Fonts & Custom Style Override -->
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Montserrat', sans-serif; }
        
        /* Styling Tab / Action Button */
        .tab-btn { background-color: #fef08a; color: #854d0e; border-color: #ca8a04; }
        .tab-btn.active { background-color: #4f46e5; color: white; border-color: #4f46e5; }
        
        /* Dark Mode Tab Button Override */
        .dark .tab-btn { background-color: #44403c; color: #d6d3d1; border-color: #57534e; }
        .dark .tab-btn.active { background-color: #4f46e5; color: white; border-color: #4f46e5; }
    </style>

    <!-- Dark Mode Initial Check Script -->
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || 
            (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <div class="max-w-5xl mx-auto p-4 md:p-8">
        
        <!-- HEADER & TOGGLE DARK MODE -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-200 dark:border-gray-700 pb-6 mb-6">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <span>📦</span> Manajemen Inventori Plastik
                </h1>
                <p id="status" class="text-sm font-semibold text-blue-600 dark:text-blue-400 mt-1">
                    Memuat data dari Google Sheets...
                </p>
            </div>
            
            <!-- BUTTON TOGGLE DARK MODE -->
            <button id="theme-toggle" class="px-4 py-2 text-sm font-medium rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <span id="theme-toggle-text">Mode Gelap</span>
            </button>
        </header>

        <!-- AREA TABEL UTAMA -->
        <div class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700 shadow-sm bg-white dark:bg-gray-800">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-white dark:bg-gray-950">
                        <th class="p-4 font-bold text-sm">NAMA</th>
                        <th class="p-4 font-bold text-sm">UKURAN</th>
                        <th class="p-4 font-bold text-sm">JUMLAH STOK</th>
                        <th class="p-4 font-bold text-sm text-center">AKSI KOREKSI (KURANGI)</th>
                    </tr>
                </thead>
                <tbody id="tabelStok" class="divide-y divide-gray-200 dark:divide-gray-700">
                    <!-- Data injeksi JavaScript mendarat di sini -->
                </tbody>
            </table>
        </div>

    </div>

<script>
// ====================================================================
// MASUKKAN URL API WEB APP GOOGLE SCRIPT ANDA DI BAWAH INI
const URL_API = "https://script.google.com/macros/s/AKfycbyEpxxusZ6dHZXrcHvFBut_G9Ba5XaztCns1IyP4KKAiqit7QvmXiXLLBYV30XwYwkhPw/exec";
// ====================================================================

// 1. Logika Pengaktifan & Sinkronisasi Tombol Dark Mode
const themeToggleBtn = document.getElementById('theme-toggle');
const themeToggleText = document.getElementById('theme-toggle-text');

function updateButtonText() {
    if (document.documentElement.classList.contains('dark')) {
        themeToggleText.innerText = "☀️ Mode Terang";
    } else {
        themeToggleText.innerText = "🌙 Mode Gelap";
    }
}
updateButtonText(); // Jalankan teks default saat awal dimuat

themeToggleBtn.addEventListener('click', function() {
    if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('color-theme', 'light');
    } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('color-theme', 'dark');
    }
    updateButtonText();
});


// 2. Fungsi Mengambil Data & Render Tabel dari Google Sheets
function muatDataStok() {
    const statusText = document.getElementById('status');
    statusText.innerText = "Memuat data dari Google Sheets...";
    statusText.className = "text-sm font-semibold text-blue-600 dark:text-blue-400 mt-1";
    
    fetch(URL_API)
    .then(res => res.json())
    .then(data => {
        let html = "";
        data.forEach(item => {
            html += `
                <tr class="hover:bg-gray-50 dark:hover:bg-gray-750/50 transition-colors">
                    <td class="p-4 font-bold">${item.nama}</td>
                    <td class="p-4 text-gray-600 dark:text-gray-300">${item.ukuran}</td>
                    <td id="stok-${item.row}" class="p-4 font-semibold text-green-600 dark:text-green-400">${item.jumlah}</td>
                    <td class="p-4">
                        <div class="flex items-center justify-center gap-2">
                            <input type="number" id="input-${item.row}" value="1" min="1" 
                                class="w-16 p-1.5 text-center text-sm border border-gray-300 dark:border-gray-600 rounded bg-gray-50 dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <span class="text-sm text-gray-500">Pack</span>
                            <button onclick="kurangiStok(${item.row})" id="btn-${item.row}" 
                                class="tab-btn border text-sm font-semibold px-3 py-1.5 rounded shadow-sm hover:opacity-90 active:scale-95 transition-all">
                                Kurangi
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
        document.getElementById('tabelStok').innerHTML = html;
        statusText.innerText = "✓ Data sinkron dengan Spreadsheet.";
        statusText.className = "text-sm font-semibold text-green-600 dark:text-green-400 mt-1";
    })
    .catch(err => {
        statusText.innerText = "⚠️ Gagal memuat data: " + err;
        statusText.className = "text-sm font-semibold text-red-600 dark:text-red-400 mt-1";
    });
}


// 3. Fungsi Eksekusi Pengurangan Stok Real-time
function kurangiStok(nomorBaris) {
    const inputJumlah = document.getElementById(`input-${nomorBaris}`).value;
    const btn = document.getElementById(`btn-${nomorBaris}`);
    
    btn.disabled = true;
    btn.innerText = "Proses...";

    const payload = {
        row: nomorBaris,
        jumlahKurang: inputJumlah
    };

    fetch(URL_API, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(payload)
    })
    .then(() => {
        // Ambil data terbaru untuk merender ulang isi tabel secara real-time
        muatDataStok(); 
    })
    .catch(err => {
        alert("Gagal memproses pengurangan stok: " + err);
        btn.disabled = false;
        btn.innerText = "Kurangi";
    });
}

// Eksekusi otomatis saat pertama kali landing page diakses
muatDataStok();
</script>

</body>
</html>
