<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" href="favicon.png" type="image/png">
    <title>Kalkulator Multi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #dddddd;
            --input-bg: #fafafa;
            --primary: #960000;
            --tab-bg: #f8f9fa;
            --tab-active: #960000;
            --btn-opsi-bg: #ecf0f1;
            --btn-opsi-hover: #dcdde1;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --input-bg: #2d2d2d;
            --primary: #ff4d4d;
            --tab-bg: #2d2d2d;
            --tab-active: #ff4d4d;
            --btn-opsi-bg: #333333;
            --btn-opsi-hover: #444444;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-body); padding: 10px; color: var(--text-main); transition: background 0.3s, color 0.3s; }
        .container { max-width: 550px; margin: auto; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; transition: background 0.3s; }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
        h2 { color: var(--primary); margin: 0; font-size: 20px; text-transform: uppercase; }
        .btn-theme { background: none; border: 1px solid var(--border-color); color: var(--text-main); padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        
        /* Tab Styles */
        .tab-header { display: flex; margin-bottom: 15px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 10px; background: var(--tab-bg); border: none; cursor: pointer; font-weight: bold; color: var(--text-muted); transition: 0.3s; font-size: 12px; }
        .tab-btn.active { background: var(--tab-active); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid-input { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .grid-input-full { display: grid; grid-template-columns: 1fr; margin-bottom: 10px; }
        label { display: block; font-size: 11px; font-weight: bold; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; }
        input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; background: var(--input-bg); color: var(--text-main); }
        
        .btn-main { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; }
        .btn-cari { background: #2980b9; }
        .btn-kelipatan { background: #27ae60; }

        /* Opsi Ukuran */
        #opsi-container { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .btn-opsi { background: var(--btn-opsi-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; font-weight: bold; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        .btn-opsi:hover { background: var(--btn-opsi-hover); }
        .badge-luas { font-size: 11px; background: #27ae60; color: white; padding: 3px 8px; border-radius: 4px; }

        /* Hasil Kelipatan */
        .hasil-box { background: var(--input-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; display: none; }
        .hasil-box.active { display: block; }
        .angka-besar { font-size: 24px; font-weight: bold; color: var(--primary); margin: 5px 0; }

        #preview-box { width: 100%; min-height: 250px; background: #444; margin: 15px 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; overflow: auto; padding: 10px; box-sizing: border-box;}
        .sheet { background: white; position: relative; overflow: hidden; }
        .part { border: 0.5px solid var(--primary); background: rgba(39, 174, 96, 0.2); position: absolute; box-sizing: border-box; }

        .export-area { display: none; padding: 20px; background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 15px;}
        .rincian-title { text-align: center; font-size: 18px; font-weight: bold; color: var(--text-main); margin-bottom: 20px; text-transform: uppercase; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        
        .btn-export { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: 12px; margin-top: 10px;}
        .footer-note { text-align: center; font-size: 10px; color: var(--text-muted); margin-top: 15px; }

        .log-section { background: var(--bg-card); padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px solid var(--border-color); }
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 12px; }
        .btn-prev { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-container">
            <h2>Kalkulator Multi</h2>
            <button class="btn-theme" onclick="toggleTheme()">🌗 Dark Mode</button>
        </div>
        
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab('jumlah')">1. Cari Jumlah</button>
            <button class="tab-btn" onclick="switchTab('ukuran')">2. Cari Ukuran</button>
            <button class="tab-btn" onclick="switchTab('kelipatan')">3. Cari Kelipatan</button>
        </div>

        <!-- TAB 1 & 2 GLOBAL INPUTS -->
        <div id="global-inputs">
            <div class="grid-input">
                <div><label>Nama Pesanan</label><input type="text" id="nama" placeholder="Contoh: Undangan"></div>
                <div><label>Nama Bahan</label><input type="text" id="bahan" placeholder="Contoh: Art Paper 260 gr"></div>
            </div>
            <div class="grid-input">
                <div><label>Ukuran Bahan (P)</label><input type="number" id="LB" placeholder="32"></div>
                <div><label>Ukuran Bahan (L)</label><input type="number" id="TB" placeholder="48"></div>
            </div>
            <div class="grid-input">
                <div><label>Jarak / Bleed (cm)</label><input type="number" id="jarak" value="0" step="0.1"></div>
            </div>
        </div>

        <!-- TAB 1: CARI JUMLAH -->
        <div id="tab-jumlah" class="tab-content active">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom:10px;">
                <div><label>Ukuran Potong (P)</label><input type="number" id="lk" placeholder="P cm"></div>
                <div><label>Ukuran Potong (L)</label><input type="number" id="tk" placeholder="L cm"></div>
            </div>
            <div class="grid-input">
                <div><label>Harga Modal/Lembar</label><input type="number" id="hb"></div>
                <div><label>Harga Jual/Pcs</label><input type="number" id="hj"></div>
            </div>
            <button class="btn-main" onclick="hitungManual()">HITUNG & LIHAT VISUAL</button>
        </div>

        <!-- TAB 2: CARI UKURAN -->
        <div id="tab-ukuran" class="tab-content">
            <div class="grid-input">
                <div style="grid-column: span 2;"><label>Target Jumlah (Pcs)</label><input type="number" id="target_pcs" placeholder="Contoh: 7"></div>
            </div>
            <button class="btn-main btn-cari" onclick="cariUkuranMaksimal()">CARI KEMUNGKINAN UKURAN</button>
            <div id="opsi-container"></div>
        </div>

        <!-- TAB 3: CARI KELIPATAN -->
        <div id="tab-kelipatan" class="tab-content">
            <div class="grid-input-full">
                <div><label>Nama Pemesan (Opsional)</label><input type="text" id="nama_cust_kelipatan" placeholder="Contoh: Customer A"></div>
            </div>
            <div class="grid-input">
                <div><label>Kelipatan (Pcs)</label><input type="number" id="kelipatan_pcs" placeholder="Contoh: 55"></div>
                <div><label>Order Customer (Pcs)</label><input type="number" id="order_cust" placeholder="Contoh: 500"></div>
            </div>
            <button class="btn-main btn-kelipatan" onclick="hitungKelipatan()">HITUNG KELIPATAN</button>
            
            <div id="hasil-kelipatan" class="hasil-box">
                <!-- Hasil kelipatan akan muncul di sini -->
            </div>
        </div>
    </div>

    <!-- AREA PREVIEW & EXPORT (Hanya untuk Tab 1 & 2) -->
    <div id="capture-area" class="export-area">
        <div class="rincian-title">RINCIAN PRODUKSI</div>
        <div id="rincian-isi"></div>
        <div id="preview-box"><div id="visual-sheet" class="sheet"></div></div>
        <div class="footer-note">Dicetak otomatis melalui Kalkulator Multi</div>
    </div>

    <div id="export-buttons" style="display:none; gap:10px; margin-bottom: 15px;">
        <button class="btn-export" style="background:#e67e22;" onclick="saveImage()">SIMPAN GAMBAR</button>
        <button class="btn-export" style="background:#e74c3c;" onclick="savePDF()">SIMPAN PDF</button>
    </div>

    <!-- AREA LOG HISTORY (Tab 1 & 2) -->
    <div id="log-container" class="log-section">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <strong>Riwayat Log (50 Terakhir)</strong>
            <button onclick="clearLog()" style="font-size:10px; color:red; border:none; background:none; cursor:pointer;">Hapus Log</button>
        </div>
        <div id="log-list"></div>
    </div>

    <!-- AREA LOG HISTORY KHUSUS KELIPATAN (Tab 3) -->
    <div id="log-kelipatan-container" class="log-section" style="display:none;">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <strong>Riwayat Kelipatan (50 Terakhir)</strong>
            <button onclick="clearKelipatanLog()" style="font-size:10px; color:red; border:none; background:none; cursor:pointer;">Hapus Log</button>
        </div>
        <div id="log-kelipatan-list"></div>
    </div>

</div>

<script>
    // THEME TOGGLE
    function toggleTheme() {
        const body = document.body;
        if (body.dataset.theme === "dark") {
            body.dataset.theme = "light";
            localStorage.setItem("theme", "light");
        } else {
            body.dataset.theme = "dark";
            localStorage.setItem("theme", "dark");
        }
    }
    if (localStorage.getItem("theme") === "dark") document.body.dataset.theme = "dark";

    // SWITCH TAB UI
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById('tab-' + tabId).classList.add('active');
        
        const globalInputs = document.getElementById('global-inputs');
        const exportArea = document.getElementById('capture-area');
        const exportBtns = document.getElementById('export-buttons');
        const logArea = document.getElementById('log-container');
        const logKelipatanArea = document.getElementById('log-kelipatan-container');

        if (tabId === 'kelipatan') {
            globalInputs.style.display = 'none';
            exportArea.style.display = 'none';
            exportBtns.style.display = 'none';
            logArea.style.display = 'none';
            logKelipatanArea.style.display = 'block'; // Tampilkan log kelipatan
        } else {
            globalInputs.style.display = 'block';
            logArea.style.display = 'block';
            logKelipatanArea.style.display = 'none'; // Sembunyikan log kelipatan
            if (document.getElementById('visual-sheet').innerHTML !== "") {
                exportArea.style.display = 'block';
                exportBtns.style.display = 'flex';
            }
        }
    }

    // FUNGSI DASAR LAYOUT (Tab 1 & 2)
    function getLayout(W, H, p, l, jarak) {
        let items = [];
        let nx = Math.floor(W / (p + jarak));
        let ny = Math.floor(H / (l + jarak));
        for(let y=0; y<ny; y++) {
            for(let x=0; x<nx; x++) {
                items.push({x: x*(p+jarak), y: y*(l+jarak), w: p, h: l});
            }
        }
        let sisaX = W - (nx * (p+jarak));
        if (sisaX >= l) {
            let nxSisa = Math.floor(sisaX / (l + jarak));
            let nySisa = Math.floor(H / (p + jarak));
            for(let y=0; y<nySisa; y++) {
                for(let x=0; x<nxSisa; x++) {
                    items.push({x: (nx*(p+jarak)) + (x*(l+jarak)), y: y*(p+jarak), w: l, h: p});
                }
            }
        }
        return items;
    }

    // TAB 1: HITUNG MANUAL & VISUAL
    function hitungManual(isFromLog = false, logData = null) {
        let d;
        if(isFromLog) {
            d = logData;
            document.getElementById('nama').value = d.nama;
            document.getElementById('bahan').value = d.bahan;
            document.getElementById('LB').value = d.LB;
            document.getElementById('TB').value = d.TB;
            document.getElementById('lk').value = d.lk;
            document.getElementById('tk').value = d.tk;
            document.getElementById('jarak').value = d.jarak;
            document.getElementById('hb').value = d.hb || 0;
            document.getElementById('hj').value = d.hj || 0;
        } else {
            d = {
                nama: document.getElementById('nama').value || "-",
                bahan: document.getElementById('bahan').value || "-",
                LB: parseFloat(document.getElementById('LB').value),
                TB: parseFloat(document.getElementById('TB').value),
                lk: parseFloat(document.getElementById('lk').value),
                tk: parseFloat(document.getElementById('tk').value),
                jarak: parseFloat(document.getElementById('jarak').value) || 0,
                hb: parseFloat(document.getElementById('hb').value) || 0,
                hj: parseFloat(document.getElementById('hj').value) || 0
            };
        }

        if(!d.LB || !d.TB || !d.lk || !d.tk) return alert("Lengkapi data dimensi Bahan dan Potong!");

        let l1 = getLayout(d.LB, d.TB, d.lk, d.tk, d.jarak);
        let l2 = getLayout(d.LB, d.TB, d.tk, d.lk, d.jarak);
        let finalItems = l1.length >= l2.length ? l1 : l2;
        let hasil = finalItems.length;
        let totalJual = hasil * d.hj;
        let profit = totalJual - d.hb;

        document.getElementById('rincian-isi').innerHTML = `
            <div class="detail-row"><span>Pesanan / Bahan:</span> <span>${d.nama} / ${d.bahan}</span></div>
            <div class="detail-row"><span>Ukuran Bahan:</span> <span>${d.LB} x ${d.TB} cm</span></div>
            <div class="detail-row"><span>Ukuran Potong:</span> <span>${d.lk} x ${d.tk} cm</span></div>
            <div class="detail-row"><span>Hasil Potong:</span> <span style="color:var(--primary); font-weight:bold;">${hasil} Pcs</span></div>
            ${d.hb > 0 ? `<hr style="border:0; border-top:1px solid var(--border-color); margin:5px 0;">
            <div class="detail-row"><span>Modal / Jual Total:</span> <span>Rp ${d.hb.toLocaleString()} / Rp ${totalJual.toLocaleString()}</span></div>
            <div class="detail-row"><span>Estimasi Profit:</span> <span style="color:#007BFF; font-weight:bold;">Rp ${profit.toLocaleString()}</span></div>` : ''}
        `;

        renderVisual(d.LB, d.TB, finalItems);

        document.getElementById('capture-area').style.display = 'block';
        document.getElementById('export-buttons').style.display = 'flex';
        
        if(!isFromLog) saveToLog(d, hasil, profit);
    }

    function renderVisual(W, H, items) {
        const visualSheet = document.getElementById('visual-sheet');
        visualSheet.innerHTML = "";
        
        const containerWidth = document.getElementById('preview-box').clientWidth - 20;
        const scale = Math.min(containerWidth / W, 250 / H);
        
        visualSheet.style.width = (W * scale) + "px";
        visualSheet.style.height = (H * scale) + "px";

        items.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'part';
            div.style.left = (item.x * scale) + "px"; div.style.top = (item.y * scale) + "px";
            div.style.width = (item.w * scale) + "px"; div.style.height = (item.h * scale) + "px";
            div.style.display = "flex"; div.style.alignItems = "center"; div.style.justifyContent = "center";
            div.style.fontSize = "10px"; div.style.color = "var(--primary)"; div.style.fontWeight = "bold";
            div.innerText = index + 1;
            visualSheet.appendChild(div);
        });
    }

    // TAB 2: PENCARI UKURAN (REVERSE)
    function cariUkuranMaksimal() {
        let W = parseFloat(document.getElementById('LB').value);
        let H = parseFloat(document.getElementById('TB').value);
        let target = parseInt(document.getElementById('target_pcs').value);
        let jarak = parseFloat(document.getElementById('jarak').value) || 0;

        if(!W || !H || !target) return alert("Isi Ukuran Bahan dan Target Pcs!");

        let opsiDitemukan = [];
        let maxLuasPerPcs = (W * H) / target;
        
        for(let p = W; p >= 2; p -= 0.5) {
            for(let l = p; l >= 2; l -= 0.5) {
                if((p * l) > maxLuasPerPcs) continue; 
                let maxHasil = Math.max(getLayout(W, H, p, l, jarak).length, getLayout(W, H, l, p, jarak).length);

                if(maxHasil === target) {
                    let cekP = Math.max(getLayout(W, H, p+0.5, l, jarak).length, getLayout(W, H, l, p+0.5, jarak).length);
                    let cekL = Math.max(getLayout(W, H, p, l+0.5, jarak).length, getLayout(W, H, l+0.5, p, jarak).length);
                    
                    if(cekP < target && cekL < target) {
                        opsiDitemukan.push({ p: p, l: l, luas: (p*l).toFixed(2) });
                    }
                }
            }
        }

        let hasilFilter = [];
        opsiDitemukan.sort((a,b) => b.luas - a.luas);

        opsiDitemukan.forEach(opsi => {
            let sudahAdaYangMirip = hasilFilter.some(h => (Math.abs(h.p - opsi.p) <= 2 && Math.abs(h.l - opsi.l) <= 2));
            if(!sudahAdaYangMirip && hasilFilter.length < 5) hasilFilter.push(opsi);
        });

        tampilkanOpsiUI(hasilFilter, target);
    }

    function tampilkanOpsiUI(data, targetPcs) {
        let container = document.getElementById('opsi-container');
        container.innerHTML = `<p style="font-size:12px; margin-bottom:5px;">Ditemukan ${data.length} opsi ukuran maksimal untuk ${targetPcs} Pcs:</p>`;
        
        if(data.length === 0) {
            container.innerHTML += `<div style="color:var(--primary); font-size:12px;">Tidak ditemukan ukuran presisi. Coba ubah target.</div>`;
            return;
        }

        data.forEach(item => {
            let btn = document.createElement('button');
            btn.className = 'btn-opsi';
            btn.innerHTML = `<span>📏 ${item.p} x ${item.l} cm</span> <span class="badge-luas">Area: ${item.luas} cm²</span>`;
            btn.onclick = () => {
                document.getElementById('lk').value = item.p;
                document.getElementById('tk').value = item.l;
                switchTab('jumlah');
                hitungManual();
            };
            container.appendChild(btn);
        });
    }

    // TAB 3: CARI KELIPATAN
    function hitungKelipatan(isFromLog = false, logData = null) {
        let kelipatan, order, namaCust;
        
        if (isFromLog) {
            kelipatan = logData.kelipatan;
            order = logData.order;
            namaCust = logData.namaCust;
            document.getElementById('kelipatan_pcs').value = kelipatan;
            document.getElementById('order_cust').value = order;
            document.getElementById('nama_cust_kelipatan').value = namaCust !== "Tanpa Nama" ? namaCust : "";
        } else {
            kelipatan = parseInt(document.getElementById('kelipatan_pcs').value);
            order = parseInt(document.getElementById('order_cust').value);
            namaCust = document.getElementById('nama_cust_kelipatan').value || "Tanpa Nama";
        }
        
        let box = document.getElementById('hasil-kelipatan');

        if (!kelipatan || !order) return alert("Masukkan nilai kelipatan dan order!");

        if (order % kelipatan === 0) {
            let lembar = order / kelipatan;
            box.innerHTML = `
                <div style="font-size: 14px;">Order pas dengan kelipatan!</div>
                <div class="angka-besar">${order} Pcs</div>
                <div style="font-size: 14px; color: var(--text-muted);">Membutuhkan tepat ${lembar} lembar.</div>
            `;
        } else {
            let turun = Math.floor(order / kelipatan) * kelipatan;
            let naik = Math.ceil(order / kelipatan) * kelipatan;d
            let lembarTurun = Math.floor(order / kelipatan);
            let lembarNaik = Math.ceil(order / kelipatan);

            box.innerHTML = `
                <div style="font-size: 12px; margin-bottom:10px; id="ket" color: var(--text-muted);">Order ${order} pcs tidak sesuai kelipatan ${kelipatan} pcs. Pilihan terdekat bisa co ${turun} pcs atau ${naik} pcs kakak</div>
                <div <button onclick="getElementById('ket')" style="font-size: 12px; margin-bottom:10px color: var(--text-muted);">salin</button>
                <div style="display:flex; justify-content:space-between; gap:10px;">
                    <div style="flex:1; padding:10px; border:1px solid var(--border-color); border-radius:8px;">
                        <div style="font-size:11px; text-transform:uppercase;">Opsi Turun</div>
                        <div class="angka-besar" style="font-size:18px;">${turun} pcs</div>
                        <div style="font-size:12px;">(${lembarTurun} Lembar)</div>
                    </div>
                    <div style="flex:1; padding:10px; border:1px solid var(--border-color); border-radius:8px;">
                        <div style="font-size:11px; text-transform:uppercase;">Opsi Naik</div>
                        <div class="angka-besar" style="font-size:18px;">${naik} pcs</div>
                        <div style="font-size:12px;">(${lembarNaik} Lembar)</div>
                    </div>
                </div>
            `;
        }
        box.classList.add('active');

        if(!isFromLog) saveKelipatanLog(namaCust, kelipatan, order);
    }

    // SYSTEM LOG & EXPORT (TAB 1 & 2)
    function saveToLog(fullData, hasil, untung) {
        let logs = JSON.parse(localStorage.getItem('kalkulator_multi_logs')) || [];
        const entry = { ...fullData, hasil, untung, waktu: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
        logs.unshift(entry);
        if(logs.length > 50) logs.pop();
        localStorage.setItem('kalkulator_multi_logs', JSON.stringify(logs));
        renderLog();
    }

    function renderLog() {
        const list = document.getElementById('log-list');
        let logs = JSON.parse(localStorage.getItem('kalkulator_multi_logs')) || [];
        list.innerHTML = logs.map((l, index) => `
            <div class="log-item">
                <div><b style="color:var(--text-main);">${l.nama} (${l.hasil} Pcs)</b><br><small style="color:var(--text-muted);">${l.lk}x${l.tk} cm | ${l.waktu}</small></div>
                <button class="btn-prev" onclick='previewLog(${index})'>PREVIEW</button>
            </div>
        `).join('');
    }

    function previewLog(index) {
        let logs = JSON.parse(localStorage.getItem('kalkulator_multi_logs')) || [];
        switchTab('jumlah');
        hitungManual(true, logs[index]);
        window.scrollTo({ top: document.getElementById('capture-area').offsetTop - 20, behavior: 'smooth' });
    }

    function clearLog() { if(confirm("Hapus semua riwayat layout?")) { localStorage.removeItem('kalkulator_multi_logs'); renderLog(); } }
    
    // SYSTEM LOG KHUSUS KELIPATAN (TAB 3)
    function saveKelipatanLog(namaCust, kelipatan, order) {
        let logs = JSON.parse(localStorage.getItem('kalkulator_kelipatan_logs')) || [];
        const entry = { namaCust, kelipatan, order, waktu: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
        logs.unshift(entry);
        if(logs.length > 50) logs.pop();
        localStorage.setItem('kalkulator_kelipatan_logs', JSON.stringify(logs));
        renderKelipatanLog();
    }

    function renderKelipatanLog() {
        const list = document.getElementById('log-kelipatan-list');
        let logs = JSON.parse(localStorage.getItem('kalkulator_kelipatan_logs')) || [];
        list.innerHTML = logs.map((l, index) => `
            <div class="log-item">
                <div><b style="color:var(--text-main);">${l.namaCust}</b><br><small style="color:var(--text-muted);">Isi ${l.kelipatan}/Lbr | Order: ${l.order} Pcs | ${l.waktu}</small></div>
                <button class="btn-prev" style="background:#27ae60;" onclick='previewKelipatanLog(${index})'>PREVIEW</button>
            </div>
        `).join('');
    }

    function previewKelipatanLog(index) {
        let logs = JSON.parse(localStorage.getItem('kalkulator_kelipatan_logs')) || [];
        hitungKelipatan(true, logs[index]);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearKelipatanLog() { if(confirm("Hapus semua riwayat kelipatan?")) { localStorage.removeItem('kalkulator_kelipatan_logs'); renderKelipatanLog(); } }

    // EXPORT FUNCTIONS
    function saveImage() { html2canvas(document.querySelector("#capture-area")).then(canvas => {
        let link = document.createElement('a'); link.download = `Layout-Multi.png`; link.href = canvas.toDataURL(); link.click();
    }); }
    function savePDF() { const { jsPDF } = window.jspdf; html2canvas(document.querySelector("#capture-area")).then(canvas => {
        const doc = new jsPDF(); doc.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 10, 190, 0); doc.save("Layout-Multi.pdf");
    }); }
    
    // ON LOAD INITIALIZATION
    window.onload = function() {
        renderLog();
        renderKelipatanLog();
    };
</script>
</body>
</html>
